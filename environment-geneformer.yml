# Environment for the Geneformer searches. Cannot coexist with the scGPT environment.
#   conda env create -f environment-geneformer.yml
#   conda activate advcell-geneformer
name: advcell-geneformer
channels: [conda-forge]
dependencies:
  - python=3.10
  - pip
  - pip:
      # torch is the CUDA 12.4 build. Adjust to your environment.
      #   pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - transformers==4.51.0
      - tokenizers==0.21.4
      - datasets==5.0.0
      - accelerate==1.14.0
      - numpy==1.26.4
      - scipy==1.15.3
      - pandas==2.3.3
      - scikit-learn==1.7.2
      - scanpy==1.11.5
      - anndata==0.11.4
      # Geneformer itself comes from its distributor:
      #   pip install git+https://huggingface.co/ctheodoris/Geneformer
